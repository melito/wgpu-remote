[workspace]
resolver = "3"
members = [
    "crates/wgpu-remote",
    "crates/wgpu-remote-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/melito/wgpu-remote"

[workspace.dependencies]
# Pin wgpu — client and server MUST agree on this exact version
wgpu = "27"
wgpu-types = { version = "27", features = ["serde"] }

# Wire format
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bytes = { version = "1", features = ["serde"] }

# Async + transport
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync"] }
futures-util = "0.3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# Errors
thiserror = "2"

# Tests / dev
anyhow = "1"
