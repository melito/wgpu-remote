[package]
name = "wgpu-remote-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end tests for wgpu-remote, including an in-memory transport."
publish = false

[dependencies]
wgpu-remote = { path = "../wgpu-remote", features = ["client", "server", "quic", "iroh"] }
tokio = { workspace = true, features = ["time"] }
futures-util.workspace = true
anyhow.workspace = true
bytes.workspace = true
wgpu-types.workspace = true
rustls.workspace = true

[dev-dependencies]
# The wgpu drop-in tests drive the public `wgpu` API directly.
wgpu.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
