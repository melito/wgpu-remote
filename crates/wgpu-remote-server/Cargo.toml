[package]
name = "wgpu-remote-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Server that replays wgpu-remote actions against a real wgpu::Instance."

[[bin]]
name = "wgpu-remote-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
wgpu-remote-protocol.workspace = true
wgpu-remote-transport.workspace = true
wgpu-remote-transport-iroh.workspace = true
wgpu.workspace = true
wgpu-types.workspace = true
tokio = { workspace = true, features = ["sync"] }
bytes.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rustls.workspace = true

[dev-dependencies]
wgpu-remote-client.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process"] }
bytes.workspace = true
wgpu-types.workspace = true
