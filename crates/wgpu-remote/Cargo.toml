[package]
name = "wgpu-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Run wgpu workloads on a GPU that lives on another machine."
readme = "../../README.md"
keywords = ["wgpu", "gpu", "remote", "quic", "iroh"]
categories = ["graphics", "network-programming"]

[features]
default = ["wgpu-27", "client", "quic"]

# ── wgpu version — pick EXACTLY ONE ─────────────────────────────────────────
# The wire descriptors use `wgpu-types` and the client/server touch `wgpu`'s
# custom-backend API, so both are version-selected. The chosen version feature
# aliases its `wgpu`/`wgpu-types` to the bare names the crate uses (see `lib.rs`),
# so a consumer on wgpu 27 or 29 opts in without the crate carrying two copies.
wgpu-27 = ["dep:wgpu-27", "dep:wgpu-types-27"]
wgpu-29 = ["dep:wgpu-29", "dep:wgpu-types-29"]

# wgpu-shaped client facade + drop-in (`install`, `connect_quic`, `connect_iroh`).
# Needs a wgpu version feature (the drop-in speaks wgpu's custom backend).
client = []
# Replay engine as a library (`wgpu_remote::server`).
server = ["dep:anyhow"]
# quinn-based QUIC transport + private CA.
quic = ["dep:quinn", "dep:rustls", "dep:rcgen"]
# iroh transport — NAT-traversed QUIC.
iroh = ["dep:iroh", "dep:rustls"]
# `wgpu-remote-server` binary (both transports).
server-bin = ["server", "quic", "iroh"]
# `wgpu-remote-cli` demo binary (both transports).
cli = ["client", "quic", "iroh", "dep:anyhow"]

[[bin]]
name = "wgpu-remote-server"
path = "src/bin/wgpu-remote-server.rs"
required-features = ["server-bin"]

[[bin]]
name = "wgpu-remote-cli"
path = "src/bin/wgpu-remote-cli.rs"
required-features = ["cli"]

[dependencies]
# Always: wire format + transport core.
serde.workspace = true
bincode.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true

# wgpu-types — the serializable wire descriptors, version-selected. Aliased to
# the bare `wgpu_types` name by the active version feature (see `lib.rs`).
wgpu-types-27 = { package = "wgpu-types", version = "27", features = ["serde"], optional = true }
wgpu-types-29 = { package = "wgpu-types", version = "29", features = ["serde"], optional = true }

# Real wgpu — client drop-in (custom instance) and server (real GPU),
# version-selected. Aliased to the bare `wgpu` name by the active version feature.
wgpu-27 = { package = "wgpu", version = "27", features = ["custom"], optional = true }
wgpu-29 = { package = "wgpu", version = "29", features = ["custom"], optional = true }

# QUIC transport.
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

# iroh transport.
iroh = { version = "1.0.0-rc.1", optional = true }

# Binaries.
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process"] }
anyhow.workspace = true
# iroh transport tests spin up a local relay.
iroh-relay = { version = "1.0.0-rc.1", features = ["server", "test-utils"] }
sha1 = "0.11.0-rc.5"
