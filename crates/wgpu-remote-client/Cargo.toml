[package]
name = "wgpu-remote-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side wgpu-shaped facade for a remote GPU. For a true wgpu drop-in see the wgpu-remote-wgpu crate."

[features]
default = ["quic"]
quic = []
iroh = ["dep:wgpu-remote-transport-iroh"]

[dependencies]
wgpu-remote-protocol.workspace = true
wgpu-remote-transport.workspace = true
wgpu-remote-transport-iroh = { workspace = true, optional = true }
wgpu.workspace = true
wgpu-types.workspace = true
tokio.workspace = true
bytes.workspace = true
bincode.workspace = true
thiserror.workspace = true
